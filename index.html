<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Schlegel | Interactive DSP & EM Visualizers</title>
    <style>
        /* Modern Dark Dashboard Theme Matching the Visualizers */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --tab-active: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tab Navigation Bar Layout */
        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #21262d;
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: var(--tab-active);
            color: #ffffff;
            border-color: var(--tab-active);
            box-shadow: 0 0 10px rgba(31, 111, 235, 0.4);
        }

        /* Embedded App Panels */
        .tab-panel {
            display: none;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .tab-panel.active {
            display: block;
        }

        /* Seamless Responsive Embed Frame styling */
        .embed-frame {
            width: 100%;
            height: 85vh; /* Responsive scaling filling 85% of screen height */
            border: none;
            background-color: transparent;
            display: block;
        }

        /* Footer layout */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Ben Schlegel's Engineering Hub</h1>
        <p>Interactive Math, Signal Processing, and Electromagnetic Field Explorations</p>
    </header>

    <div class="container">
        <!-- Interactive Navigation Options -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab(event, 'em-wave')">📡 EM Wave Visualizer</button>
            <button class="tab-btn" onclick="switchTab(event, 'adc-sampling')">🎛️ ADC Sampling & Aliasing</button>
        </div>

        <!-- Tab Content Panel 1: Electromagnetic Wave Visualizer -->
        <div id="em-wave" class="tab-panel active">
            <iframe class="embed-frame" src="em_wave_visual_explorer_enhanced.html" title="Uniform Plane Wave Visualizer EM Theory"></iframe>
        </div>

        <!-- Tab Content Panel 2: ADC Sampling Simulator -->
        <div id="adc-sampling" class="tab-panel">
            <iframe class="embed-frame" src="adc_sampling_aliasing_visualizer.html" title="ADC Sampling & Aliasing Simulator"></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 benrschlegel.github.io • Built with HTML5, CSS3, and JavaScript</p>
    </footer>

    <script>
        // Tab UI panel switching controller
        function switchTab(event, tabId) {
            // Hide all active panels
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            // Deactivate all navigation tab buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Activate chosen target panel and visual button highlight
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
